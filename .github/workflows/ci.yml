name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tes memakai analyzer palsu, jadi TensorFlow tidak perlu dipasang.
      - run: pip install "Flask>=3.1.3" flask-cors opencv-python-headless numpy pytest
      - run: pytest -q
      - run: python scripts/build_static.py _site
